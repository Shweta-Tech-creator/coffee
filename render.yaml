services:
  # Node Web Service for full-stack deployment on Render
  - type: web
    name: bean-haven-coffee
    env: node
    buildCommand: npm run build
    startCommand: node backend/server.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
